<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Escape</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #080812;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game {
            position: relative;
            width: 900px;
            height: 600px;
            max-width: 95vw;
            max-height: 90vh;
            background: #111122;
            border: 3px solid #00f7ff;
            box-shadow:
                0 0 20px #00f7ff,
                inset 0 0 30px rgba(0, 247, 255, 0.15);
            overflow: hidden;
        }

        #player {
            position: absolute;
            width: 30px;
            height: 30px;
            background: #00f7ff;
            box-shadow: 0 0 15px #00f7ff;
            border-radius: 6px;
        }

        .enemy {
            position: absolute;
            width: 28px;
            height: 28px;
            background: #ff1744;
            box-shadow: 0 0 15px #ff1744;
            border-radius: 50%;
        }

        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            z-index: 10;
            text-shadow: 0 0 8px #00f7ff;
        }

        #message {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(5, 5, 15, 0.85);
            z-index: 20;
        }

        #message h1 {
            color: #00f7ff;
            text-shadow: 0 0 15px #00f7ff;
            font-size: 50px;
            margin: 0 0 15px;
        }

        #message p {
            font-size: 18px;
            color: #ddd;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            border: 2px solid #00f7ff;
            background: transparent;
            color: #00f7ff;
            font-size: 18px;
            cursor: pointer;
            border-radius: 6px;
        }

        button:hover {
            background: #00f7ff;
            color: #080812;
            box-shadow: 0 0 20px #00f7ff;
        }
    </style>
</head>

<body>

<div id="game">

    <div id="ui">
        <div>Skor: <span id="score">0</span></div>
        <div>Süre: <span id="time">30</span></div>
    </div>

    <div id="player"></div>

    <div id="message">
        <h1>NEON ESCAPE</h1>
        <p>WASD veya yön tuşlarıyla hareket et.</p>
        <p>30 saniye boyunca düşmanlardan kaç!</p>
        <button id="startButton">OYUNA BAŞLA</button>
    </div>

</div>

<script>
    const game = document.getElementById("game");
    const player = document.getElementById("player");
    const scoreText = document.getElementById("score");
    const timeText = document.getElementById("time");
    const message = document.getElementById("message");
    const startButton = document.getElementById("startButton");

    let playerX = 435;
    let playerY = 285;

    let score = 0;
    let timeLeft = 30;

    let gameRunning = false;

    const keys = {};

    document.addEventListener("keydown", (event) => {
        keys[event.key.toLowerCase()] = true;
    });

    document.addEventListener("keyup", (event) => {
        keys[event.key.toLowerCase()] = false;
    });

    function updatePlayer() {

        const speed = 5;

        if (keys["w"] || keys["arrowup"]) {
            playerY -= speed;
        }

        if (keys["s"] || keys["arrowdown"]) {
            playerY += speed;
        }

        if (keys["a"] || keys["arrowleft"]) {
            playerX -= speed;
        }

        if (keys["d"] || keys["arrowright"]) {
            playerX += speed;
        }

        const maxX = game.clientWidth - player.offsetWidth;
        const maxY = game.clientHeight - player.offsetHeight;

        playerX = Math.max(0, Math.min(playerX, maxX));
        playerY = Math.max(0, Math.min(playerY, maxY));

        player.style.left = playerX + "px";
        player.style.top = playerY + "px";
    }

    function gameLoop() {

        if (!gameRunning) return;

        updatePlayer();

        requestAnimationFrame(gameLoop);
    }

    function startGame() {

        gameRunning = true;

        score = 0;
        timeLeft = 30;

        playerX = 435;
        playerY = 285;

        scoreText.textContent = score;
        timeText.textContent = timeLeft;

        message.style.display = "none";

        gameLoop();
    }

    startButton.addEventListener("click", startGame);

    player.style.left = playerX + "px";
    player.style.top = playerY + "px";
</script>

</body>
</html>
