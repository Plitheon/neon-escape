<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON ESCAPE</title>

<style>
* {
    box-sizing: border-box;
    user-select: none;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050510;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

#game {
    position: relative;
    width: min(100vw, 1100px);
    height: min(100vh, 700px);
    overflow: hidden;
    background:
        radial-gradient(circle at center, #151536 0%, #080816 60%, #030308 100%);
    border: 2px solid #00f7ff;
    box-shadow:
        0 0 15px #00f7ff,
        0 0 50px rgba(0,247,255,.2);
}

canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

#hud {
    position: absolute;
    top: 18px;
    left: 20px;
    right: 20px;
    z-index: 5;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
}

.hudBox {
    min-width: 150px;
    padding: 10px 15px;
    border: 1px solid rgba(0,247,255,.5);
    background: rgba(0,0,20,.65);
    box-shadow: 0 0 15px rgba(0,247,255,.12);
}

.label {
    color: #7b8794;
    font-size: 11px;
    letter-spacing: 2px;
}

.value {
    color: #00f7ff;
    font-size: 24px;
    font-weight: bold;
    text-shadow: 0 0 10px #00f7ff;
}

#healthOuter {
    width: 180px;
    height: 8px;
    margin-top: 6px;
    background: #24101a;
}

#health {
    width: 100%;
    height: 100%;
    background: #00ff88;
    box-shadow: 0 0 10px #00ff88;
    transition: width .15s;
}

#crosshair {
    position: absolute;
    width: 24px;
    height: 24px;
    transform: translate(-50%, -50%);
    border: 1px solid rgba(0,247,255,.8);
    border-radius: 50%;
    pointer-events: none;
    z-index: 10;
}

#crosshair::before,
#crosshair::after {
    content: "";
    position: absolute;
    background: #00f7ff;
}

#crosshair::before {
    width: 34px;
    height: 1px;
    left: -6px;
    top: 11px;
}

#crosshair::after {
    width: 1px;
    height: 34px;
    left: 11px;
    top: -6px;
}

#screen {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: rgba(2,2,10,.84);
    backdrop-filter: blur(5px);
}

.panel {
    width: min(90%, 600px);
    padding: 45px 30px;
    border: 1px solid rgba(0,247,255,.6);
    background: rgba(5,8,25,.88);
    box-shadow:
        0 0 30px rgba(0,247,255,.15),
        inset 0 0 30px rgba(0,247,255,.04);
}

h1 {
    margin: 0;
    color: #00f7ff;
    font-size: clamp(42px, 8vw, 78px);
    letter-spacing: 8px;
    text-shadow:
        0 0 10px #00f7ff,
        0 0 30px #00f7ff;
}

.subtitle {
    margin: 10px 0 25px;
    color: #ff2670;
    letter-spacing: 4px;
    text-shadow: 0 0 10px #ff2670;
}

.instructions {
    color: #aeb8c5;
    line-height: 1.8;
    margin-bottom: 25px;
}

button {
    border: 2px solid #00f7ff;
    color: #00f7ff;
    background: transparent;
    padding: 14px 35px;
    font-size: 17px;
    font-weight: bold;
    letter-spacing: 2px;
    cursor: pointer;
    transition: .2s;
}

button:hover {
    color: #050510;
    background: #00f7ff;
    box-shadow: 0 0 25px #00f7ff;
}

.hidden {
    display: none !important;
}

#flash {
    position: absolute;
    inset: 0;
    z-index: 15;
    background: rgba(255,0,60,.25);
    pointer-events: none;
    opacity: 0;
}

#mobileControls {
    display: none;
}

@media (max-width: 700px) {
    #game {
        border-width: 1px;
    }

    #hud {
        top: 10px;
        left: 10px;
        right: 10px;
    }

    .hudBox {
        min-width: 105px;
        padding: 7px;
    }

    .value {
        font-size: 18px;
    }

    #healthOuter {
        width: 110px;
    }

    #mobileControls {
        display: block;
        position: absolute;
        bottom: 20px;
        left: 20px;
        z-index: 12;
    }

    .mobileButton {
        width: 48px;
        height: 48px;
        margin: 2px;
        padding: 0;
        border: 1px solid rgba(0,247,255,.6);
        background: rgba(0,20,30,.6);
        color: #00f7ff;
        font-size: 20px;
    }

    .row {
        display: flex;
        justify-content: center;
    }
}
</style>
</head>

<body>

<div id="game">

    <canvas id="canvas"></canvas>

    <div id="hud">

        <div class="hudBox">
            <div class="label">SCORE</div>
            <div class="value" id="score">0</div>
        </div>

        <div class="hudBox">
            <div class="label">TIME</div>
            <div class="value" id="time">30</div>
        </div>

        <div class="hudBox">
            <div class="label">HP</div>
            <div id="healthOuter">
                <div id="health"></div>
            </div>
        </div>

    </div>

    <div id="crosshair"></div>
    <div id="flash"></div>

    <div id="mobileControls">
        <div class="row">
            <button class="mobileButton" data-key="w">▲</button>
        </div>
        <div class="row">
            <button class="mobileButton" data-key="a">◀</button>
            <button class="mobileButton" data-key="s">▼</button>
            <button class="mobileButton" data-key="d">▶</button>
        </div>
    </div>

    <div id="screen">

        <div class="panel">

            <h1>NEON</h1>
            <div class="subtitle">ESCAPE</div>

            <div class="instructions">
                <b>WASD / OK TUŞLARI</b> — Hareket<br>
                <b>FARE</b> — Nişan al<br>
                <b>SOL TIK</b> — Ateş et<br><br>

                Düşmanları yok et ve 30 saniye hayatta kal.
            </div>

            <button id="startButton">OYUNA BAŞLA</button>

        </div>

    </div>

</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const game = document.getElementById("game");
const scoreEl = document.getElementById("score");
const timeEl = document.getElementById("time");
const healthEl = document.getElementById("health");
const screen = document.getElementById("screen");
const startButton = document.getElementById("startButton");
const crosshair = document.getElementById("crosshair");
const flash = document.getElementById("flash");

let W = 0;
let H = 0;

function resize() {
    W = game.clientWidth;
    H = game.clientHeight;

    canvas.width = W;
    canvas.height = H;
}

resize();
window.addEventListener("resize", resize);

/* -------------------------
   OYUNCU
------------------------- */

const player = {
    x: 0,
    y: 0,
    radius: 15,
    speed: 4,
    hp: 100,
    maxHp: 100,
    angle: 0,
    shootCooldown: 0
};

/* -------------------------
   OYUN
------------------------- */

let running = false;
let score = 0;
let timeLeft = 30;

let enemies = [];
let bullets = [];
let particles = [];

let keys = {};

let mouse = {
    x: W / 2,
    y: H / 2,
    down: false
};

let lastTime = 0;
let spawnTimer = 0;
let screenShake = 0;

/* -------------------------
   KLAVYE
------------------------- */

window.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;

    if (
        ["w", "a", "s", "d", "arrowup", "arrowdown", "arrowleft", "arrowright", " "]
        .includes(e.key.toLowerCase())
    ) {
        e.preventDefault();
    }
});

window.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

/* -------------------------
   MOUSE
------------------------- */

game.addEventListener("mousemove", e => {

    const rect = game.getBoundingClientRect();

    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;

    crosshair.style.left = mouse.x + "px";
    crosshair.style.top = mouse.y + "px";
});

game.addEventListener("mousedown", e => {
    if (e.button === 0) {
        mouse.down = true;
    }
});

window.addEventListener("mouseup", e => {
    if (e.button === 0) {
        mouse.down = false;
    }
});

/* -------------------------
   MOBİL KONTROLLER
------------------------- */

document.querySelectorAll(".mobileButton").forEach(button => {

    const key = button.dataset.key;

    button.addEventListener("touchstart", e => {
        e.preventDefault();
        keys[key] = true;
    });

    button.addEventListener("touchend", e => {
        e.preventDefault();
        keys[key] = false;
    });
});

/* -------------------------
   BAŞLAT
------------------------- */

function startGame() {

    resize();

    running = true;

    score = 0;
    timeLeft = 30;

    enemies = [];
    bullets = [];
    particles = [];

    player.x = W / 2;
    player.y = H / 2;

    player.hp = 100;
    player.shootCooldown = 0;

    scoreEl.textContent = "0";
    timeEl.textContent = "30";
    healthEl.style.width = "100%";
    healthEl.style.background = "#00ff88";

    screen.classList.add("hidden");

    lastTime = performance.now();

    requestAnimationFrame(gameLoop);
}

/* -------------------------
   DÜŞMAN OLUŞTUR
------------------------- */

function spawnEnemy() {

    let x;
    let y;

    const side = Math.floor(Math.random() * 4);

    if (side === 0) {
        x = Math.random() * W;
        y = -40;
    }

    if (side === 1) {
        x = W + 40;
        y = Math.random() * H;
    }

    if (side === 2) {
        x = Math.random() * W;
        y = H + 40;
    }

    if (side === 3) {
        x = -40;
        y = Math.random() * H;
    }

    enemies.push({
        x,
        y,
        radius: 14 + Math.random() * 5,
        speed: 1.1 + Math.random() * .7 + (30 - timeLeft) * .025,
        hp: 1,
        hitFlash: 0
    });
}

/* -------------------------
   ATEŞ
------------------------- */

function shoot() {

    if (player.shootCooldown > 0) return;

    const dx = mouse.x - player.x;
    const dy = mouse.y - player.y;

    const distance = Math.hypot(dx, dy);

    if (distance === 0) return;

    const speed = 10;

    bullets.push({
        x: player.x,
        y: player.y,
        vx: dx / distance * speed,
        vy: dy / distance * speed,
        life: 70
    });

    player.shootCooldown = 10;

    createParticles(
        player.x + dx / distance * 20,
        player.y + dy / distance * 20,
        "#00f7ff",
        4
    );
}

/* -------------------------
   PARÇACIK
------------------------- */

function createParticles(x, y, color, amount = 10) {

    for (let i = 0; i < amount; i++) {

        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3 + 1;

        particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 25 + Math.random() * 25,
            maxLife: 50,
            size: Math.random() * 3 + 1,
            color
        });
    }
}

/* -------------------------
   OYUNCU GÜNCELLE
------------------------- */

function updatePlayer(dt) {

    let dx = 0;
    let dy = 0;

    if (keys["w"] || keys["arrowup"]) dy--;
    if (keys["s"] || keys["arrowdown"]) dy++;
    if (keys["a"] || keys["arrowleft"]) dx--;
    if (keys["d"] || keys["arrowright"]) dx++;

    if (dx !== 0 || dy !== 0) {

        const length = Math.hypot(dx, dy);

        dx /= length;
        dy /= length;

        player.x += dx * player.speed * dt;
        player.y += dy * player.speed * dt;
    }

    player.x = Math.max(player.radius, Math.min(W - player.radius, player.x));
    player.y = Math.max(player.radius, Math.min(H - player.radius, player.y));

    player.angle = Math.atan2(
        mouse.y - player.y,
        mouse.x - player.x
    );

    if (player.shootCooldown > 0) {
        player.shootCooldown -= dt;
    }

    if (mouse.down) {
        shoot();
    }
}

/* -------------------------
   DÜŞMAN GÜNCELLE
------------------------- */

function updateEnemies(dt) {

    for (let i = enemies.length - 1; i >= 0; i--) {

        const enemy = enemies[i];

        const dx = player.x - enemy.x;
        const dy = player.y - enemy.y;

        const distance = Math.hypot(dx, dy);

        if (distance > 0) {

            enemy.x += dx / distance * enemy.speed * dt;
            enemy.y += dy / distance * enemy.speed * dt;
        }

        if (enemy.hitFlash > 0) {
            enemy.hitFlash -= dt;
        }

        if (distance < player.radius + enemy.radius) {

            player.hp -= 22 * dt;

            screenShake = 5;

            flash.style.opacity = ".12";

            setTimeout(() => {
                flash.style.opacity = "0";
            }, 50);

            if (player.hp <= 0) {

                player.hp = 0;

                endGame(false);
                return;
            }
        }
    }
}

/* -------------------------
   MERMİLER
------------------------- */

function updateBullets(dt) {

    for (let i = bullets.length - 1; i >= 0; i--) {

        const bullet = bullets[i];

        bullet.x += bullet.vx * dt;
        bullet.y += bullet.vy * dt;

        bullet.life -= dt;

        let removeBullet = false;

        if (
            bullet.life <= 0 ||
            bullet.x < -50 ||
            bullet.x > W + 50 ||
            bullet.y < -50 ||
            bullet.y > H + 50
        ) {
            removeBullet = true;
        }

        for (let j = enemies.length - 1; j >= 0; j--) {

            const enemy = enemies[j];

            const distance = Math.hypot(
                bullet.x - enemy.x,
                bullet.y - enemy.y
            );

            if (distance < enemy.radius + 5) {

                createParticles(
                    enemy.x,
                    enemy.y,
                    "#ff2670",
                    15
                );

                enemies.splice(j, 1);

                score += 100;

                scoreEl.textContent = score;

                removeBullet = true;

                screenShake = 4;

                break;
            }
        }

        if (removeBullet) {
            bullets.splice(i, 1);
        }
    }
}

/* -------------------------
   PARÇACIKLAR
------------------------- */

function updateParticles(dt) {

    for (let i = particles.length - 1; i >= 0; i--) {

        const p = particles[i];

        p.x += p.vx * dt;
        p.y += p.vy * dt;

        p.vx *= .96;
        p.vy *= .96;

        p.life -= dt;

        if (p.life <= 0) {
            particles.splice(i, 1);
        }
    }
}

/* -------------------------
   ÇİZİM
------------------------- */

function drawBackground() {

    ctx.fillStyle = "#080816";
    ctx.fillRect(0, 0, W, H);

    /* Grid */

    ctx.strokeStyle = "rgba(0,247,255,.07)";
    ctx.lineWidth = 1;

    const grid = 40;

    for (let x = 0; x < W; x += grid) {

        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
    }

    for (let y = 0; y < H; y += grid) {

        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
    }

    /* Ortadaki neon alan */

    const gradient = ctx.createRadialGradient(
        W / 2,
        H / 2,
        0,
        W / 2,
        H / 2,
        Math.max(W, H) / 2
    );

    gradient.addColorStop(0, "rgba(0,247,255,.08)");
    gradient.addColorStop(1, "rgba(0,0,0,0)");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);
}

/* -------------------------
   OYUNCUYU ÇİZ
------------------------- */

function drawPlayer() {

    ctx.save();

    ctx.translate(player.x, player.y);
    ctx.rotate(player.angle);

    /* Glow */

    ctx.shadowBlur = 25;
    ctx.shadowColor = "#00f7ff";

    /* Gövde */

    ctx.fillStyle = "#00f7ff";

    ctx.beginPath();

    ctx.moveTo(20, 0);
    ctx.lineTo(-12, -12);
    ctx.lineTo(-7, 0);
    ctx.lineTo(-12, 12);
    ctx.closePath();

    ctx.fill();

    /* İç */

    ctx.shadowBlur = 0;

    ctx.fillStyle = "#06121a";

    ctx.beginPath();
    ctx.arc(-2, 0, 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

/* -------------------------
   DÜŞMAN ÇİZ
------------------------- */

function drawEnemies() {

    enemies.forEach(enemy => {

        ctx.save();

        ctx.translate(enemy.x, enemy.y);

        ctx.shadowBlur = 22;
        ctx.shadowColor = "#ff1744";

        ctx.fillStyle =
            enemy.hitFlash > 0
                ? "#ffffff"
                : "#ff1744";

        ctx.beginPath();
        ctx.arc(
            0,
            0,
            enemy.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.shadowBlur = 0;

        ctx.fillStyle = "#29000b";

        ctx.beginPath();
        ctx.arc(0, 0, enemy.radius * .45, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    });
}

/* -------------------------
   MERMİLERİ ÇİZ
------------------------- */

function drawBullets() {

    bullets.forEach(bullet => {

        ctx.save();

        ctx.fillStyle = "#00f7ff";
        ctx.shadowBlur = 15;
        ctx.shadowColor = "#00f7ff";

        ctx.beginPath();

        ctx.arc(
            bullet.x,
            bullet.y,
            4,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.restore();
    });
}

/* -------------------------
   PARÇACIKLARI ÇİZ
------------------------- */

function drawParticles() {

    particles.forEach(p => {

        ctx.save();

        ctx.globalAlpha = Math.max(0, p.life / p.maxLife);

        ctx.fillStyle = p.color;

        ctx.shadowBlur = 10;
        ctx.shadowColor = p.color;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.restore();
    });
}

/* -------------------------
   OYUN DÖNGÜSÜ
------------------------- */

function gameLoop(timestamp) {

    if (!running) return;

    let dt = (timestamp - lastTime) / 16.67;

    if (dt > 2) dt = 2;

    lastTime = timestamp;

    /* Süre */

    timeLeft -= dt / 60;

    if (timeLeft <= 0) {

        timeLeft = 0;

        timeEl.textContent = "0";

        endGame(true);

        return;
    }

    timeEl.textContent = Math.ceil(timeLeft);

    /* Düşman spawn */

    spawnTimer -= dt;

    const spawnSpeed =
        Math.max(
            25,
            75 - (30 - timeLeft) * 1.5
        );

    if (spawnTimer <= 0) {

        spawnEnemy();

        if (timeLeft < 20 && Math.random() < .25) {
            spawnEnemy();
        }

        spawnTimer = spawnSpeed;
    }

    updatePlayer(dt);
    updateEnemies(dt);
    updateBullets(dt);
    updateParticles(dt);

    /* HP */

    healthEl.style.width =
        Math.max(0, player.hp) + "%";

    if (player.hp < 35) {
        healthEl.style.background = "#ff1744";
        healthEl.style.boxShadow = "0 0 10px #ff1744";
    } else {
        healthEl.style.background = "#00ff88";
        healthEl.style.boxShadow = "0 0 10px #00ff88";
    }

    /* Ekran çiz */

    ctx.save();

    if (screenShake > 0) {

        ctx.translate(
            (Math.random() - .5) * screenShake,
            (Math.random() - .5) * screenShake
        );

        screenShake *= .85;
    }

    drawBackground();
    drawParticles();
    drawBullets();
    drawEnemies();
    drawPlayer();

    ctx.restore();

    requestAnimationFrame(gameLoop);
}

/* -------------------------
   OYUN SONU
------------------------- */

function endGame(won) {

    running = false;
    mouse.down = false;

    screen.classList.remove("hidden");

    const panel = screen.querySelector(".panel");

    if (won) {

        panel.innerHTML = `
            <h1 style="color:#00ff88;text-shadow:0 0 20px #00ff88">
                KAZANDIN
            </h1>

            <div class="subtitle" style="color:#00ff88">
                NEON SURVIVOR
            </div>

            <div class="instructions">
                30 saniye hayatta kaldın!<br><br>
                <b>SKOR: ${score}</b>
            </div>

            <button id="restartButton">
                TEKRAR OYNA
            </button>
        `;

    } else {

        panel.innerHTML = `
            <h1 style="color:#ff1744;text-shadow:0 0 20px #ff1744">
                YOK OLDUN
            </h1>

            <div class="subtitle">
                GAME OVER
            </div>

            <div class="instructions">
                Düşmanlar seni yakaladı.<br><br>
                <b>SKOR: ${score}</b>
            </div>

            <button id="restartButton">
                TEKRAR OYNA
            </button>
        `;
    }

    document
        .getElementById("restartButton")
        .addEventListener("click", startGame);
}

/* -------------------------
   BAŞLAT BUTONU
------------------------- */

startButton.addEventListener("click", startGame);

</script>

</body>
</html>
